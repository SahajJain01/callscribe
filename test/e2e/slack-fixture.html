<!doctype html>
<html>
<head><!--ATTACKER--><meta charset="utf-8" /><title>Fixture huddle</title></head>
<body>
<!-- You stay muted (mic switch off) for the whole fixture, so any sound in the recording
     must come from the remote WebRTC track. -->
<!-- Mimics the Slack web client's huddle markup (selectors from OpenClaw's slack-huddles plugin).
     ?locale=es: Spanish UI labels, so mute detection can't lean on English text.
     ?manual: nothing happens until the test calls window.__join() / window.__leave().
     The e2e servers replace the ATTACKER comment in <head> with a hostile inline script (attacker.js). -->
<div data-qa="channel_name_button">design-team</div>
<div id="huddle"></div>
<script>
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const log = (m) => (window.__log = (window.__log || []).concat(m))

async function remoteAudio() {
  // Two peer connections on this page: "Them" sends a 440 Hz tone that we receive as a remote track.
  const ctx = new AudioContext()
  const osc = ctx.createOscillator(); osc.frequency.value = 440
  const dst = ctx.createMediaStreamDestination(); osc.connect(dst); osc.start()
  const a = new RTCPeerConnection(), b = new RTCPeerConnection()
  a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate)
  b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate)
  b.ontrack = (e) => { const el = new Audio(); el.srcObject = e.streams[0] || new MediaStream([e.track]); el.play().catch(() => {}); log("remote track") }
  dst.stream.getTracks().forEach((t) => a.addTrack(t, dst.stream))
  await a.setLocalDescription(await a.createOffer()); await b.setRemoteDescription(a.localDescription)
  await b.setLocalDescription(await b.createAnswer()); await a.setRemoteDescription(b.localDescription)
}

function caption(speaker, text, wrapper) {
  const w = wrapper || document.createElement("div")
  if (!wrapper) {
    w.className = "p-huddle_closed_caption_event__wrapper"
    w.innerHTML = `<span class="p-huddle_closed_caption_event__member_name"></span><div class="p-huddle_closed_caption_event__event_text"><span data-qa="huddle_closed_caption_event"></span></div>`
    document.querySelector(".p-huddle_closed_captions").appendChild(w)
  }
  w.querySelector(".p-huddle_closed_caption_event__member_name").textContent = speaker
  w.querySelector('[data-qa="huddle_closed_caption_event"]').textContent = text
  return w
}

const es = location.search.includes("locale=es")
// The page's own animation loop: the e2e counts its frames to see whether the render keepalive runs.
window.__frames = 0
const raf = window.requestAnimationFrame.bind(window)
const loop = () => { window.__frames++; raf(loop) }
raf(loop)

function join() {
  document.getElementById("huddle").innerHTML = `
    <div data-qa="huddle_window_titlebar_title">Huddle in #design-team</div>
    <div data-qa="huddle_toolbar_buttons_center">
      <button role="switch" aria-label="${es ? "Micrófono" : "Microphone"}" aria-describedby="microphone-info" aria-checked="false">Mic</button>
      <span id="microphone-info" hidden>Fake Audio Input</span>
      <button data-qa="huddle_toolbar__leave_button">${es ? "Salir" : "Leave"}</button>
    </div>
    <div class="p-huddle_closed_captions"></div>`
  log("joined")
}
window.__join = join
window.__leave = () => { document.getElementById("huddle").innerHTML = ""; log("left") }
let media = null
window.__media = () => media || (media = (async () => {
  await navigator.mediaDevices.getUserMedia({ audio: true }) // fake mic (beep) via Chrome flags
  if (!location.search.includes("noremote")) await remoteAudio()
})())

async function run() {
  await window.__media()
  join()
  await sleep(2500)
  const r1 = caption("Alice Nguyen", "Morning everyone")
  await sleep(600); caption("Alice Nguyen", "Morning everyone, let us look at", r1)
  await sleep(600); caption("Alice Nguyen", "Morning everyone, let us look at the new landing page", r1)
  await sleep(1200)
  const r2 = caption("Sahaj Jain", "Sure, I pushed")
  await sleep(600); caption("Sahaj Jain", "Sure, I pushed the hero changes last night", r2)
  await sleep(1200)
  // Slack trims old rows: the first one disappears.
  r1.remove()
  const r3 = caption("Alice Nguyen", "Great, ship it on Friday")
  await sleep(8000)
  if (location.search.includes("stay")) return log("staying") // crash test: never leave
  document.getElementById("huddle").innerHTML = "" // leave the huddle
  log("left")
}
if (location.search.includes("manual")) window.__media().then(() => log("ready"), (e) => log("fixture error " + e))
else run().catch((e) => log("fixture error " + e))
</script>
</body>
</html>
