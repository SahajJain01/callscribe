<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; --muted: #888; --accent: #1a73e8; --rec: #d93025; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; width: 360px; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  .card { margin: 0 14px 10px; padding: 10px 12px; border: 1px solid #8884; border-radius: 8px; }
  .live { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--rec); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35 } }
  .muted { color: var(--muted); }
  .warn { color: #e37400; margin-top: 6px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 14px 6px; }
  ul { list-style: none; margin: 0; padding: 0 14px 4px; max-height: 260px; overflow: auto; }
  li { padding: 8px 0; border-bottom: 1px solid #8883; }
  li:last-child { border-bottom: 0; }
  .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid #8886; background: transparent; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.del:hover { border-color: var(--rec); color: var(--rec); }
  label { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  select { font: inherit; font-size: 12px; }
  details { margin: 0 14px 12px; }
  summary { cursor: pointer; color: var(--muted); }
  .empty { padding: 4px 14px 12px; }
  h2 .n { text-transform: none; letter-spacing: 0; font-weight: normal; }
  #more { display: block; margin: 6px 0 4px; width: 100%; }
  #more[hidden] { display: none; }
</style>
</head>
<body>
  <header><h1>CallScribe</h1><span class="muted" id="ver"></span></header>
  <div class="card" id="now"><span class="muted">Checking this tab…</span></div>
  <h2>Calls <span class="n" id="count"></span></h2>
  <div class="empty muted" id="empty" hidden>Nothing yet. Calls show up here once they start.</div>
  <ul id="list"></ul>
  <div style="padding: 0 14px"><button id="more" hidden>Show more</button></div>
  <p class="muted" style="margin: 4px 14px 8px; font-size: 11px">A call is removed from the browser 30 days after its files were saved to Downloads. Calls that weren't saved stay until you delete them.</p>
  <details>
    <summary>Settings</summary>
    <label><input type="checkbox" data-k="autoCaptions" /> Turn captions on automatically</label>
    <label><input type="checkbox" data-k="showOverlay" /> Show recording overlay on the call</label>
    <label><input type="checkbox" data-k="recordAudio" /> Record audio backup</label>
    <label><input type="checkbox" data-k="includeMic" /> Include my microphone in the audio</label>
    <label><input type="checkbox" data-k="autoDownload" /> Save files to Downloads/CallScribe when a call ends</label>
    <label>Caption language (Meet) <select id="lang"></select></label>
  </details>
  <script src="../shared/languages.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
